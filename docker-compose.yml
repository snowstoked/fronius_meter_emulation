services:
  fronius-meter-emulation:
    restart: always
    build:
      context: .
    ports:
      - "1502:1502"
    environment:
      - HA_URL=http://192.168.0.2:8123
      - HA_TOKEN=your_long_lived_access_token
      - SHELLY_MODBUS=192.168.0.3:502
      # - SHELLY_REST=192.168.0.3  # read over HTTP instead of modbus
      # - SHELLY_INVERT=true  # flip power direction
      # - FRONIUS_SERIAL=00000002  # default: the Modbus address the inverter uses
      # - FRONIUS_DEBUG=true
      - HA_EXTRA_IMPORT=sensor.fronius_solar_extra_import
      - HA_EXTRA_EXPORT=sensor.fronius_solar_extra_export
      - FRONIUS_MODBUS_BIND=0.0.0.0:1502

    healthcheck:
      test: netstat -an | grep 1502 > /dev/null; if [ 0 != $? ]; then exit 1; fi;
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
